[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "threads-parser"
version = "2.0.0"
description = "Concurrent public Threads profile and search parser"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright>=1.48,<2", "httpx>=0.27,<1", "pyotp>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
threads-parser = "threads_parser.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/threads_parser"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
